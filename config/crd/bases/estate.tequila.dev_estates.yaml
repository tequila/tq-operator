---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: estates.estate.tequila.dev
spec:
  group: estate.tequila.dev
  names:
    categories:
    - tequila
    kind: Estate
    listKind: EstateList
    plural: estates
    singular: estate
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.environment
      name: Environment
      type: string
    - jsonPath: .status.conditions[?(@.type=="Observed")].status
      name: Observed
      type: string
    - jsonPath: .status.conditions[?(@.type=="Reported")].status
      name: Reported
      type: string
    - jsonPath: .status.conditions[?(@.type=="Drifted")].status
      name: Drifted
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Estate is one environment's declared state (spec, from the tenant's render) and the
          operator's observation of it (status, the report the operator sends).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              EstateSpec is the environment block of tequila.yaml, resolved by the tenant's render.
              It is written by Flux alone; the operator never writes it.
            properties:
              environment:
                description: Environment is the environment's name in tequila.yaml.
                maxLength: 63
                pattern: ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$
                type: string
              namespaces:
                description: 'Namespaces are the environment''s two namespaces: the
                  platform estate''s and the services''.'
                properties:
                  platform:
                    description: Platform is the namespace the estate renders into
                      (default operations).
                    maxLength: 63
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                  services:
                    description: Services is the namespace the services render into.
                    maxLength: 63
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                required:
                - platform
                - services
                type: object
              operator:
                description: Operator configures the operator for this environment.
                properties:
                  capabilities:
                    description: |-
                      Capabilities is the ladder's enabled rungs; observe is the floor, and an empty list is
                      an environment whose operator is off.
                    items:
                      description: |-
                        Capability is a rung of the operator's ladder: observe, verify, gate, act — each rung adds
                        one capability to the one below it.
                      enum:
                      - observe
                      - verify
                      - gate
                      - act
                      type: string
                    maxItems: 4
                    type: array
                    x-kubernetes-list-type: set
                  report:
                    description: ReportSpec configures the report to console.tequila.dev.
                    properties:
                      enabled:
                        default: true
                        description: Enabled sends the report; false keeps status
                          in-cluster only.
                        type: boolean
                      interval:
                        default: 15m
                        description: |-
                          Interval is the heartbeat: an unchanged report is re-sent this often. A Go duration
                          string, kept as the render wrote it ("15m" — a Duration type would re-marshal "15m0s").
                        maxLength: 32
                        pattern: ^([0-9]+(\.[0-9]+)?(ns|us|µs|ms|s|m|h))+$
                        type: string
                      ownServices:
                        default: true
                        description: OwnServices reports the tenant's own services
                          (name, kind, replicas, image refs).
                        type: boolean
                    type: object
                type: object
              platform:
                additionalProperties:
                  type: string
                description: |-
                  Platform is every other platform.<pin> of tequila.yaml, resolved (the platform estate,
                  tofu, …).
                type: object
              product:
                description: Product is the product this environment belongs to, as
                  <owner>/<slug>.
                maxLength: 201
                pattern: ^[a-z0-9]([a-z0-9-]*[a-z0-9])?/[a-z0-9]([a-z0-9-]*[a-z0-9])?$
                type: string
              profile:
                description: Profile is the environment's tenant profile, as rendered.
                properties:
                  backup:
                    description: 'EstateBackup is the environment''s backup promise:
                      who backs up its data.'
                    properties:
                      provider:
                        enum:
                        - atlas
                        - estate
                        - external
                        - none
                        type: string
                    type: object
                  cloud:
                    enum:
                    - aws
                    - generic
                    type: string
                  keda_in_cluster:
                    type: boolean
                  mongodb_in_cluster:
                    type: boolean
                  monitoring_in_cluster:
                    type: boolean
                  nats_in_cluster:
                    type: boolean
                  valkey_in_cluster:
                    type: boolean
                type: object
              renderer:
                description: Renderer is the renderer pins the render was made with.
                properties:
                  klass8s-cli:
                    type: string
                  manifests-core:
                    type: string
                  tq-cli:
                    type: string
                type: object
              services:
                additionalProperties:
                  description: |-
                    EstateService is one registered service. A Tequila-made service carries its repository,
                    pinned version and own: false; a tenant's own, push-rendered service is {own: true} alone.
                  properties:
                    own:
                      type: boolean
                    repo:
                      type: string
                    version:
                      type: string
                  type: object
                description: Services is every service registered for this environment,
                  by name.
                type: object
              source:
                description: |-
                  Source names the repository the render came from. The commit Flux applied is observed in
                  the cluster (status.applied), never written into the render.
                properties:
                  repository:
                    description: Repository is the gitops repository, as <org>/<name>.
                    maxLength: 201
                    pattern: ^[A-Za-z0-9][A-Za-z0-9-]*/[A-Za-z0-9._-]+$
                    type: string
                required:
                - repository
                type: object
            required:
            - environment
            - namespaces
            - product
            - source
            type: object
          status:
            description: |-
              EstateStatus is the operator's observation: applied and running state compared with spec.
              It is written by the operator alone, through the status subresource.

              An Estate is a report, never a workload, and it must never gate the Flux Kustomization that
              applies it (wait: true): Flux's health check holds a custom resource while a top-level
              status.observedGeneration differs from metadata.generation or while a condition of type Ready
              is False. So the status has neither: each condition records the generation it was set for in
              its own observedGeneration, and the operator's own state is the condition Observed.
            properties:
              applied:
                description: AppliedStatus is what Flux applied.
                properties:
                  kustomizations:
                    items:
                      description: KustomizationStatus is one Flux Kustomization.
                      properties:
                        appliedRevision:
                          nullable: true
                          type: string
                        attached:
                          description: |-
                            Attached is true when the Kustomization is suspended AND carries the attachment
                            annotation (tequila.dev/attached-by) a developer's inner loop writes when it runs a local
                            checkout over the rendered workloads. The workloads it applies report state attached,
                            and neither they nor the Kustomization are drift. Only the annotation's presence is
                            read; who attached is never held or reported.
                          type: boolean
                        lastReconcile:
                          description: LastReconcile is the Ready condition's last
                            transition.
                          format: date-time
                          nullable: true
                          type: string
                        name:
                          type: string
                        ready:
                          type: boolean
                        reason:
                          description: Reason is the Ready condition's reason — Flux's
                            own word, never its message.
                          type: string
                        suspended:
                          description: 'Suspended is spec.suspend: Flux applies nothing
                            from it until it is resumed.'
                          type: boolean
                      required:
                      - appliedRevision
                      - lastReconcile
                      - name
                      - ready
                      - reason
                      type: object
                    maxItems: 200
                    type: array
                  source:
                    description: AppliedSource is the Flux source the Kustomizations
                      apply from.
                    properties:
                      kind:
                        enum:
                        - GitRepository
                        - OCIRepository
                        type: string
                      name:
                        type: string
                      revision:
                        description: Revision is the source's artifact revision; null
                          before the first artifact.
                        nullable: true
                        type: string
                    required:
                    - kind
                    - name
                    - revision
                    type: object
                required:
                - kustomizations
                - source
                type: object
              cluster:
                description: ClusterStatus is what the cluster says of itself.
                properties:
                  kubernetes:
                    description: Kubernetes is the API server's version.
                    type: string
                  nodes:
                    description: NodesStatus counts the nodes; it never names one.
                    properties:
                      architectures:
                        items:
                          type: string
                        maxItems: 8
                        type: array
                      count:
                        format: int32
                        type: integer
                      kubeletVersions:
                        items:
                          type: string
                        maxItems: 32
                        type: array
                    required:
                    - architectures
                    - count
                    - kubeletVersions
                    type: object
                  platform:
                    enum:
                    - eks
                    - k3s
                    - doks
                    - generic
                    type: string
                required:
                - kubernetes
                - nodes
                - platform
                type: object
              conditions:
                description: Conditions are Observed, Reported and Drifted — never
                  Ready.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              drift:
                items:
                  description: Drift is one difference between declared and observed
                    state.
                  properties:
                    declared:
                      nullable: true
                      type: string
                    kind:
                      description: DriftKind is the class of a difference between
                        declared and observed state.
                      enum:
                      - RunningBehind
                      - AppliedBehind
                      - NotReady
                      - SecretNotResolvable
                      - Undeclared
                      - NoEstate
                      type: string
                    observed:
                      nullable: true
                      type: string
                    subject:
                      description: Subject is <namespace>/<workload>, a Kustomization's
                        name or an object's <namespace>/<name>.
                      type: string
                  required:
                  - declared
                  - kind
                  - observed
                  - subject
                  type: object
                maxItems: 200
                type: array
              externalSecrets:
                description: ExternalSecretsStatus counts the ExternalSecrets of the
                  two estate namespaces.
                properties:
                  notReady:
                    items:
                      description: NotReadyExternalSecret is an ExternalSecret whose
                        Ready condition is not True.
                      properties:
                        name:
                          type: string
                        namespace:
                          type: string
                        reason:
                          type: string
                      required:
                      - name
                      - namespace
                      - reason
                      type: object
                    maxItems: 100
                    type: array
                  ready:
                    format: int32
                    type: integer
                  total:
                    format: int32
                    type: integer
                required:
                - notReady
                - ready
                - total
                type: object
              health:
                description: HealthStatus is the Pods' health in the two estate namespaces.
                properties:
                  pods:
                    description: PodHealth counts Pods by phase; crash-looping workloads
                      are named <namespace>/<workload>.
                    properties:
                      crashLooping:
                        items:
                          type: string
                        maxItems: 100
                        type: array
                      failed:
                        format: int32
                        type: integer
                      pending:
                        format: int32
                        type: integer
                      running:
                        format: int32
                        type: integer
                    required:
                    - crashLooping
                    - failed
                    - pending
                    - running
                    type: object
                required:
                - pods
                type: object
              lastReport:
                description: LastReport is the last report attempt.
                properties:
                  at:
                    format: date-time
                    type: string
                  outcome:
                    description: ReportOutcome is how the last report attempt ended.
                    enum:
                    - accepted
                    - unreachable
                    - unbound
                    - refused
                    - invalid
                    type: string
                  status:
                    description: Status is the HTTP status of the answer; absent when
                      nothing answered.
                    format: int32
                    type: integer
                required:
                - at
                - outcome
                type: object
              preflight:
                description: Preflight is rung verify's; always empty at rung observe.
                items:
                  description: |-
                    PreflightResult is rung verify's answer to "would this estate accept that release?".
                    No entry exists at rung observe.
                  properties:
                    check:
                      type: string
                    detail:
                      type: string
                    outcome:
                      type: string
                    release:
                      type: string
                  required:
                  - check
                  - detail
                  - outcome
                  - release
                  type: object
                maxItems: 0
                type: array
              running:
                description: RunningStatus is what the kubelet runs.
                properties:
                  estate:
                    description: RunningEstate is the estate's own version, as stamped
                      on its workloads.
                    properties:
                      operationsK8s:
                        nullable: true
                        type: string
                    required:
                    - operationsK8s
                    type: object
                  truncated:
                    description: Truncated is true when the estate had more workloads
                      than the cap.
                    type: boolean
                  workloads:
                    items:
                      description: Workload is one Deployment of the two estate namespaces.
                      properties:
                        crashLooping:
                          description: |-
                            CrashLooping is true while a container of one of the workload's Pods waits in
                            CrashLoopBackOff, or lies terminated with at least one restart behind it in a Pod that is
                            still running (the kubelet will start it again).
                          type: boolean
                        images:
                          items:
                            description: Image is one container image of a workload.
                            properties:
                              digest:
                                description: Digest is what the kubelet pulled (containerStatuses[].imageID);
                                  null until a Pod runs it.
                                nullable: true
                                type: string
                              ref:
                                type: string
                              signature:
                                description: Signature is unverified at rung observe.
                                enum:
                                - unverified
                                - valid
                                - invalid
                                - unsigned
                                type: string
                            required:
                            - digest
                            - ref
                            - signature
                            type: object
                          maxItems: 16
                          type: array
                        kind:
                          enum:
                          - Deployment
                          type: string
                        name:
                          type: string
                        namespace:
                          type: string
                        replicas:
                          description: Replicas is a workload's desired and ready
                            replica counts.
                          properties:
                            desired:
                              format: int32
                              type: integer
                            ready:
                              format: int32
                              type: integer
                          required:
                          - desired
                          - ready
                          type: object
                        restarts:
                          description: Restarts is the sum of the container restart
                            counts over the workload's current Pods.
                          format: int32
                          type: integer
                        service:
                          description: |-
                            Service is the registered service the workload belongs to; null for the estate's own
                            workloads and for a tenant's own services.
                          nullable: true
                          type: string
                        state:
                          description: State is managed, or attached while a developer's
                            inner loop runs a checkout over it.
                          enum:
                          - managed
                          - attached
                          type: string
                        undeclared:
                          description: |-
                            Undeclared is true for a services-namespace workload whose image is a platform image
                            (its repository path is platform/<name>) and whose service spec.services does not list
                            — such a workload is also an Undeclared drift. Never true in the platform namespace.
                          type: boolean
                      required:
                      - images
                      - kind
                      - name
                      - namespace
                      - replicas
                      - service
                      type: object
                    maxItems: 500
                    type: array
                required:
                - estate
                - truncated
                - workloads
                type: object
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
