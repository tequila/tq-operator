# Rung observe — the floor: read-only, on named kinds. role.yaml is generated by `make manifests`;
# every object carries app.kubernetes.io/name=tq-operator so
# `kubectl get clusterrole,role -A -l app.kubernetes.io/name=tq-operator` is the whole truth.
resources:
  - service_account.yaml
  - role.yaml
  - role_binding.yaml
labels:
  - pairs:
      app.kubernetes.io/name: tq-operator
      app.kubernetes.io/part-of: tequila
    includeSelectors: false
