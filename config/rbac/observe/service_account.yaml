# The operator's identity: system:serviceaccount:tq-operator:tq-operator — the subject of the
# estate's federation binding at IAM (registered by `tq estate:identity`).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tq-operator
  namespace: tq-operator
  labels: { app.kubernetes.io/name: tq-operator, app.kubernetes.io/part-of: tequila }
