# The operator's Pod. No port, no probe (an in-process watchdog exits instead, and the kubelet
# restarts it), no Secret: its one credential is the projected token below, its one piece of
# trust material a public key. priorityClassName is omitted until the estate defines a
# PriorityClass for it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tq-operator
  namespace: tq-operator
  labels: { app.kubernetes.io/name: tq-operator, app.kubernetes.io/part-of: tequila }
spec:
  replicas: 1
  strategy: { type: Recreate }                 # never two copies, no leader election
  selector:
    matchLabels: { app.kubernetes.io/name: tq-operator }
  template:
    metadata:
      labels: { app.kubernetes.io/name: tq-operator, app.kubernetes.io/part-of: tequila }
    spec:
      serviceAccountName: tq-operator
      automountServiceAccountToken: true       # the API token — projected, short-lived
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: operator
          image: registry.tequila.dev/platform/tq-operator:v0.1.0 # x-release-please-version
          args:
            - --interval=15m
            - --iam-url=https://id.tequila.dev
            - --console-url=https://console.tequila.dev
            - --iam-token-file=/var/run/tequila/iam/token
            - --signing-keys=/etc/tq-operator/signing-keys.json
            - --platform-namespace=operations
            - --services-namespace=tequila
            - --flux-namespace=flux-system
            - --report-own-services=true
          env:
            - name: POD_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            # Reported as operator.image — the downward API cannot expose an image, so the
            # render sets the same reference here as in `image` above.
            - name: TQ_OPERATOR_IMAGE
              value: registry.tequila.dev/platform/tq-operator:v0.1.0 # x-release-please-version
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { cpu: 200m, memory: 192Mi }
          volumeMounts:
            - { name: iam-token, mountPath: /var/run/tequila/iam, readOnly: true }
            - { name: signing-keys, mountPath: /etc/tq-operator, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: iam-token                      # NOT a Secret: the API server mints it, the kubelet rotates it
          projected:
            sources:
              - serviceAccountToken: { path: token, audience: https://id.tequila.dev, expirationSeconds: 3600 }
        - name: signing-keys                   # the release catalogue's public keys, rendered — an empty list at rung observe
          configMap: { name: tq-operator-signing-keys, optional: true }
        - name: tmp
          emptyDir: { sizeLimit: 16Mi }
